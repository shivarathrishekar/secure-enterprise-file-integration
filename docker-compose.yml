services:
  sftp-server:
    image: atmoz/sftp:latest
    container_name: integration-sftp
    ports:
      - "2223:22"
    volumes:
      - ./data:/home/integration/upload
    command: "${SFTP_USER:-integration}:${SFTP_PASSWORD:?Set SFTP_PASSWORD in .env}:${SFTP_UID:-1001}"
    restart: unless-stopped

  jenkins:
    build:
      context: ./jenkins
    container_name: integration-jenkins
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./:/app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: integration-https
    ports:
      - "8444:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  jenkins_home: